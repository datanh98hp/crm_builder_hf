# Local development: databases only, ports bound to localhost.
#   API:    npm run start:dev -w @buildcrm/api
#   Worker: npm run start:worker:dev -w @buildcrm/api   (needs REDIS_URL)
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: buildcrm, POSTGRES_PASSWORD: buildcrm_local, POSTGRES_DB: buildcrm }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg_dev:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
volumes: { pg_dev: {} }
